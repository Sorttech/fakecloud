name: DynamoDB Conformance

# Runs the independent paritysuite DynamoDB conformance suite (every test
# recorded against live DynamoDB) against a local fakecloud and fails on any
# test outside scripts/dynamodb-conformance-known-failures.txt, or on a listed
# test that now passes. No AWS credentials are used.

on:
  push:
    branches: [main]
    paths:
      - 'crates/fakecloud-dynamodb/**'
      - 'crates/fakecloud-core/**'
      - 'crates/fakecloud-aws/**'
      - 'crates/fakecloud-server/**'
      - 'Cargo.lock'
      - 'scripts/dynamodb-conformance*'
      - '.github/workflows/dynamodb-conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/fakecloud-dynamodb/**'
      - 'crates/fakecloud-core/**'
      - 'crates/fakecloud-aws/**'
      - 'crates/fakecloud-server/**'
      - 'Cargo.lock'
      - 'scripts/dynamodb-conformance*'
      - '.github/workflows/dynamodb-conformance.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  paritysuite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Build fakecloud binary
        run: cargo build --bin fakecloud

      - name: Run DynamoDB conformance suite
        run: scripts/dynamodb-conformance.sh target/debug/fakecloud
